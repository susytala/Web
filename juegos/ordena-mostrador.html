<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fde6ec">
<title>Ordená el mostrador de Manojito</title>
<meta name="description" content="Arrastrá cada pieza a su caja, ordená el mostrador y ganá un cupón de descuento en Manojito.">
<style>
  :root{
    --rosa:#f4b6c5; --rosa-fuerte:#d9849d; --rosa-oscuro:#a8576f;
    --crema:#fff6ea; --blanco:#fffdfb; --dorado:#e8c477; --dorado-oscuro:#b88a3e; --marron:#7a5a48;
    --ok:#3aa96b; --mal:#c8506b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#f3d9df;
    font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--marron);-webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:relative;margin:0 auto;height:100vh;height:100dvh;max-width:520px;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(circle at 1.5px 1.5px,rgba(232,196,119,.45) 1.4px,transparent 1.6px) 0 0/26px 26px,
               linear-gradient(180deg,#fff6ea 0%,#fde6ec 100%);box-shadow:0 0 40px rgba(168,87,111,.25)}

  #hud{display:none;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 4px}
  #hud.on{display:flex}
  .chip{background:rgba(255,253,251,.95);border:2px solid #f0cfd7;border-radius:999px;padding:6px 13px;font-weight:800;font-size:14.5px;
    color:var(--rosa-oscuro);box-shadow:0 2px 8px rgba(168,87,111,.14);white-space:nowrap}
  .chip b{font-size:16.5px}

  #juego{display:none;flex:1;min-height:0;flex-direction:column;padding:4px 14px calc(14px + env(safe-area-inset-bottom))}
  #juego.on{display:flex}
  #consigna{text-align:center;font-family:Georgia,'Lora',serif;font-style:italic;font-weight:700;color:var(--rosa-oscuro);font-size:clamp(20px,6vw,25px);margin:4px 0 8px}

  /* bandeja de piezas mezcladas */
  #bandeja{position:relative;background:var(--blanco);border:2.5px dashed #e7b9c4;border-radius:24px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    box-shadow:0 8px 22px rgba(168,87,111,.16),0 0 0 5px rgba(255,253,251,.7);min-height:0}
  #bandeja .vacio{grid-column:1/-1;text-align:center;font-weight:800;color:var(--dorado-oscuro);padding:24px 0}
  .slot{aspect-ratio:1/1;border-radius:18px;background:rgba(253,230,236,.55);border:2px dashed #f0cfd7;display:grid;place-items:center}
  .pieza{width:100%;height:100%;border-radius:18px;background:var(--crema);border:2.5px solid #e2c9a8;display:grid;place-items:center;
    font-size:clamp(34px,11.5vw,54px);line-height:1;cursor:grab;touch-action:none;box-shadow:0 4px 10px rgba(138,106,85,.22);
    animation:aparece .45s both;transition:box-shadow .15s,transform .15s,opacity .15s,border-color .15s}
  .pieza img{width:76%;height:76%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
  .pieza.arrastrando{opacity:.28;box-shadow:none}
  .pieza.elegida{border-color:var(--rosa-fuerte);box-shadow:0 0 0 4px rgba(217,132,157,.35),0 4px 10px rgba(138,106,85,.22);transform:scale(1.05)}
  @keyframes aparece{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}

  #fantasma{position:fixed;z-index:50;pointer-events:none;display:none;border-radius:18px;background:var(--crema);border:2.5px solid var(--rosa-fuerte);
    place-items:center;font-size:clamp(38px,12.5vw,58px);box-shadow:0 14px 26px rgba(168,87,111,.4);transform:scale(1.12) rotate(-4deg)}
  #fantasma.on{display:grid}
  #fantasma img{width:76%;height:76%;object-fit:contain}
  #fantasma.vuelve{transition:left .35s cubic-bezier(.3,1.3,.5,1),top .35s cubic-bezier(.3,1.3,.5,1),transform .35s}

  #mensaje{height:30px;margin:8px 0 4px;text-align:center;font-weight:800;font-size:17px;opacity:0;transition:opacity .2s}
  #mensaje.on{opacity:1} #mensaje.ok{color:var(--ok)} #mensaje.mal{color:var(--mal)}

  /* mostrador con 3 cajas */
  #mostrador{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:stretch;
    background:linear-gradient(180deg,#f3dcc0,#e8c99f);border:3px solid #d1ab78;border-radius:22px;padding:10px;
    box-shadow:0 8px 20px rgba(140,100,60,.28),inset 0 2px 0 rgba(255,255,255,.5)}
  .caja{position:relative;display:flex;flex-direction:column;align-items:center;background:var(--blanco);border:2.5px solid #e7b9c4;border-radius:16px;
    padding:8px 6px 8px;min-height:0;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;overflow:hidden}
  .caja.sobre{border-color:var(--dorado-oscuro);background:#fff7dc;transform:scale(1.04);box-shadow:0 0 0 4px rgba(232,196,119,.45)}
  .caja.sacude{animation:sacude .4s}
  @keyframes sacude{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  .caja .ic{font-size:22px;line-height:1}
  .caja h3{margin:2px 0 0;font-family:Georgia,'Lora',serif;font-style:italic;color:var(--rosa-oscuro);font-size:clamp(14px,4.2vw,17px);line-height:1.1;text-align:center}
  .caja small{font-size:11px;opacity:.75;text-align:center;line-height:1.2;margin-top:2px;font-weight:700}
  .caja .dentro{flex:1;width:100%;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;margin-top:6px}
  .puesta{width:clamp(34px,10vw,46px);height:clamp(34px,10vw,46px);border-radius:12px;background:#ffeef2;border:2px solid #f0b6c6;display:grid;place-items:center;
    font-size:clamp(22px,7vw,30px);line-height:1;animation:encaja .55s cubic-bezier(.2,1.5,.4,1) both}
  .puesta img{width:78%;height:78%;object-fit:contain}
  @keyframes encaja{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}

  .chispa{position:fixed;z-index:60;pointer-events:none;font-size:18px;animation:vuela .8s ease-out forwards}
  @keyframes vuela{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

  /* pantallas */
  .pantalla{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:70;
    background:rgba(255,246,234,.8);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .pantalla.on{display:flex}
  .tarjeta{width:100%;max-width:380px;background:var(--blanco);border:2.5px dashed #e7b9c4;border-radius:28px;padding:26px 22px 22px;text-align:center;
    box-shadow:0 10px 30px rgba(168,87,111,.22),0 0 0 6px rgba(255,253,251,.7);animation:subir .45s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes subir{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
  .logo{font-size:44px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 3px 4px rgba(168,87,111,.25))}
  h1{font-family:Georgia,'Lora',serif;font-style:italic;font-weight:700;color:var(--rosa-oscuro);margin:2px 0 8px;font-size:clamp(26px,8vw,33px);line-height:1.12}
  h1 small{display:block;font-size:.42em;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--dorado-oscuro);font-family:'Nunito',system-ui,sans-serif;margin-bottom:6px}
  .tarjeta p{margin:0 0 12px;line-height:1.45;font-size:15.5px}
  .reglas{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
  .reglas span{background:var(--crema);border:1.5px solid #ecd9bb;border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700}
  .btn{display:block;width:100%;border:none;border-radius:999px;padding:14px 18px;font-family:inherit;font-weight:800;font-size:17px;line-height:1.1;
    cursor:pointer;color:#fff;margin-top:10px;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn.jugar{background:linear-gradient(135deg,#e592ab,#b9627c);box-shadow:0 6px 16px rgba(185,98,124,.4);font-size:20px;padding:16px}
  .btn.wa{background:linear-gradient(135deg,#34c26c,#1f9a52);box-shadow:0 6px 14px rgba(31,154,82,.35)}
  .btn.compartir{background:#fff;color:var(--rosa-oscuro);border:2px solid var(--rosa-fuerte)}
  .btn.otra{background:none;color:var(--marron);text-decoration:underline;font-size:15px;font-weight:700;padding:10px}
  .mejor{margin-top:12px;font-size:13.5px;color:var(--dorado-oscuro);font-weight:800}
  .stats{display:flex;gap:10px;justify-content:center;margin:6px 0 12px}
  .stats div{background:var(--crema);border:2px solid #ecd9bb;border-radius:16px;padding:8px 16px;min-width:96px}
  .stats b{display:block;font-family:Georgia,serif;font-size:30px;color:var(--rosa-oscuro);line-height:1.1}
  .stats span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dorado-oscuro)}
  .cupon{background:linear-gradient(135deg,#fff3d6,#ffe9ef);border:2px dashed var(--dorado);border-radius:18px;padding:12px 12px 10px;margin:8px 0 6px}
  .cupon b{display:block;font-family:Georgia,serif;font-size:26px;letter-spacing:.1em;color:var(--rosa-oscuro)}
  .cupon span{font-size:14px;line-height:1.35;display:block}
  @media (max-height:640px){.logo{display:none}.tarjeta{padding:18px 16px}#consigna{margin:0 0 4px}.chip{padding:4px 10px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip">⏱️ <b id="h-tiempo">0</b>s</div>
    <div class="chip">📦 <b id="h-orden">0</b>/<span id="h-total">6</span></div>
    <div class="chip">🙈 <b id="h-errores">0</b></div>
  </div>

  <div id="juego">
    <div id="consigna"></div>
    <div id="bandeja"></div>
    <div id="mensaje"></div>
    <div id="mostrador"></div>
  </div>
  <div id="fantasma"></div>

  <!-- INICIO -->
  <div class="pantalla on" id="p-inicio">
    <div class="tarjeta">
      <div class="logo">🧺</div>
      <h1><small>Manojito · Artesanías de Mendoza</small>Ordená el mostrador de Manojito</h1>
      <p>Las piezas se mezclaron. Arrastrá cada una a su caja y dejá el mostrador impecable.</p>
      <div class="reglas">
        <span>👆 Arrastrá</span>
        <span>📦 A la caja correcta</span>
        <span>🎁 Cupón de premio</span>
      </div>
      <button class="btn jugar" id="b-empezar" type="button">Empezar 🌸</button>
      <div class="mejor" id="i-mejor"></div>
    </div>
  </div>

  <!-- FIN -->
  <div class="pantalla" id="p-fin">
    <div class="tarjeta">
      <div class="logo">🎉</div>
      <h1>¡Mostrador ordenado!</h1>
      <div class="stats">
        <div><b id="f-errores">0</b><span>errores</span></div>
        <div><b id="f-tiempo">0</b><span>segundos</span></div>
      </div>
      <div class="mejor" id="f-mejor" style="margin:0 0 6px"></div>
      <div class="cupon">
        <b id="f-codigo">MEMO10</b>
        <span id="f-cupon-t"></span>
      </div>
      <button class="btn wa" id="b-canjear" type="button">💬 Canjear por WhatsApp</button>
      <button class="btn compartir" id="b-compartir" type="button">🌸 Compartir mi resultado</button>
      <button class="btn otra" id="b-otra" type="button">↻ Jugar de nuevo</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   ⚙️  CONFIGURACIÓN: acá cambiás todo lo importante
   ========================================================== */
var CONFIG = {
  cuponNombre: 'MEMO10',          // nombre del cupón
  cuponDescuento: 10,             // porcentaje de descuento

  whatsapp: '5492617142759',      // número con código de país, sin + ni espacios
  linkCompartir: 'https://susytala.github.io/Web/ordena-mostrador.html', // link que se comparte

  consigna: 'Llevá cada pieza a su caja 👇',

  /* LAS 3 CAJAS DEL MOSTRADOR. El "id" se usa en cada pieza (campo "categoria"). */
  categorias: [
    { id: 'pelo',       titulo: 'Para el pelo', emoji: '🎀', detalle: 'moños y hebillas' },
    { id: 'accesorios', titulo: 'Accesorios',   emoji: '✨', detalle: 'para lucir' },
    { id: 'dulzuras',   titulo: 'Dulzuras',     emoji: '🍬', detalle: 'tiernas y dulces' }
  ],

  /* LAS PIEZAS y la caja donde va cada una ("categoria" = id de arriba).
     Para usar una foto real: imagen: 'imagenes/flor.png'  (PNG o JPG).
     Si la foto no carga, se usa el emoji automáticamente. */
  piezas: [
    { nombre: 'Flor',     emoji: '🌸', imagen: '', categoria: 'pelo' },
    { nombre: 'Lazo',     emoji: '🎀', imagen: '', categoria: 'pelo' },
    { nombre: 'Osito',    emoji: '🧸', imagen: '', categoria: 'pelo' },
    { nombre: 'Anillo',   emoji: '💍', imagen: '', categoria: 'accesorios' },
    { nombre: 'Mariposa', emoji: '🦋', imagen: '', categoria: 'accesorios' },
    { nombre: 'Cupcake',  emoji: '🧁', imagen: '', categoria: 'dulzuras' }
  ],

  /* Mensajes breves */
  mensajesAcierto: ['¡Eso es! ✨', '¡Perfecto! 🌸', '¡Muy bien! 💖', '¡Bien ahí! 🎀'],
  mensajeError: 'Uy, probá de nuevo 🙈'
};

/* ==========================================================
   Juego (no hace falta tocar nada de acá para abajo)
   ========================================================== */
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'manojito_mostrador_mejor';
  var S = { activo:false, t0:0, errores:0, ordenadas:0, total:0, reloj:0, drag:null, elegida:null };
  var cajaEl = {};

  function leerMejor(){ try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return null; } }
  function guardarMejor(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  function textoMejor(m){ return m ? '🏆 Tu mejor marca: ' + m.errores + (m.errores === 1 ? ' error' : ' errores') + ' en ' + m.tiempo + 's' : ''; }
  function mejorInicio(){ $('i-mejor').textContent = textoMejor(leerMejor()); }
  mejorInicio();

  function mezclar(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function pintar(el, p){
    el.textContent = '';
    if(p.imagen){
      var im = new Image(); im.alt = p.nombre; im.draggable = false;
      im.onerror = function(){ el.textContent = p.emoji; };
      im.src = p.imagen; el.appendChild(im);
    } else el.textContent = p.emoji;
  }
  function vibrar(x){ try{ if(navigator.vibrate) navigator.vibrate(x); }catch(e){} }

  var msgTimer = 0;
  function mensaje(txt, tipo){
    var m = $('mensaje'); m.textContent = txt; m.className = 'on ' + tipo;
    clearTimeout(msgTimer); msgTimer = setTimeout(function(){ m.className = ''; }, 1300);
  }

  /* ---------- armado ---------- */
  function armar(){
    S.total = CONFIG.piezas.length; S.ordenadas = 0; S.errores = 0; S.drag = null; S.elegida = null;
    $('h-total').textContent = S.total; $('h-orden').textContent = 0; $('h-errores').textContent = 0; $('h-tiempo').textContent = 0;
    $('consigna').textContent = CONFIG.consigna; $('mensaje').className = '';

    var mo = $('mostrador'); mo.innerHTML = ''; cajaEl = {};
    mo.style.gridTemplateColumns = 'repeat(' + CONFIG.categorias.length + ',1fr)';
    CONFIG.categorias.forEach(function(c){
      var d = document.createElement('div'); d.className = 'caja'; d.dataset.cat = c.id;
      d.innerHTML = '<div class="ic"></div><h3></h3><small></small><div class="dentro"></div>';
      d.querySelector('.ic').textContent = c.emoji; d.querySelector('h3').textContent = c.titulo; d.querySelector('small').textContent = c.detalle || '';
      d.addEventListener('click', function(){ if(S.elegida) intentar(S.elegida, c.id, d); });
      mo.appendChild(d); cajaEl[c.id] = d;
    });

    var b = $('bandeja'); b.innerHTML = '';
    mezclar(CONFIG.piezas).forEach(function(p, i){
      var slot = document.createElement('div'); slot.className = 'slot';
      var el = document.createElement('div'); el.className = 'pieza'; el.style.animationDelay = (i*0.06) + 's';
      el.setAttribute('role','button'); el.setAttribute('aria-label', p.nombre);
      el._p = p; pintar(el, p);
      el.addEventListener('pointerdown', function(e){ empezarArrastre(e, el); });
      slot.appendChild(el); b.appendChild(slot);
    });
  }

  function empezar(){
    armar();
    $('p-inicio').classList.remove('on'); $('p-fin').classList.remove('on');
    $('hud').classList.add('on'); $('juego').classList.add('on');
    S.activo = true; S.t0 = performance.now();
    clearInterval(S.reloj);
    S.reloj = setInterval(function(){ $('h-tiempo').textContent = Math.floor((performance.now() - S.t0)/1000); }, 250);
  }

  /* ---------- arrastrar y soltar ---------- */
  var fan = $('fantasma');
  function empezarArrastre(e, el){
    if(!S.activo || S.drag) return;
    e.preventDefault();
    var r = el.getBoundingClientRect();
    S.drag = { el:el, id:e.pointerId, ox:e.clientX - r.left, oy:e.clientY - r.top, w:r.width, h:r.height, x0:e.clientX, y0:e.clientY, t:performance.now(), movio:false, sobre:null, ix:r.left, iy:r.top };
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    el.addEventListener('pointermove', mover); el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', cancelar);
  }
  function mostrarFantasma(){
    var d = S.drag; if(d.fantasmaOn) return; d.fantasmaOn = true;
    fan.className = 'on'; fan.style.width = d.w + 'px'; fan.style.height = d.h + 'px'; pintar(fan, d.el._p);
    d.el.classList.add('arrastrando');
  }
  function mover(e){
    var d = S.drag; if(!d || e.pointerId !== d.id) return;
    if(!d.movio && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > 7){ d.movio = true; mostrarFantasma(); }
    if(!d.movio) return;
    fan.style.left = (e.clientX - d.ox) + 'px'; fan.style.top = (e.clientY - d.oy) + 'px';
    var c = cajaEn(e.clientX, e.clientY);
    if(c !== d.sobre){ if(d.sobre) d.sobre.classList.remove('sobre'); d.sobre = c; if(c) c.classList.add('sobre'); }
  }
  function cajaEn(x, y){
    for(var k in cajaEl){ var r = cajaEl[k].getBoundingClientRect(); if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cajaEl[k]; }
    return null;
  }
  function limpiar(){
    var d = S.drag; if(!d) return;
    d.el.removeEventListener('pointermove', mover); d.el.removeEventListener('pointerup', soltar); d.el.removeEventListener('pointercancel', cancelar);
    if(d.sobre) d.sobre.classList.remove('sobre');
    try{ d.el.releasePointerCapture(d.id); }catch(_){}
  }
  function soltar(e){
    var d = S.drag; if(!d || e.pointerId !== d.id) return;
    limpiar();
    if(!d.movio){ /* toque corto: selecciona la pieza (alternativa a arrastrar) */
      S.drag = null; elegir(d.el); return;
    }
    var caja = cajaEn(e.clientX, e.clientY);
    S.drag = null;
    if(!caja){ volver(d, false); return; }
    intentar(d.el, caja.dataset.cat, caja, d);
  }
  function cancelar(){ var d = S.drag; if(!d) return; limpiar(); S.drag = null; volver(d, false); }

  function elegir(el){
    if(S.elegida) S.elegida.classList.remove('elegida');
    if(S.elegida === el){ S.elegida = null; return; }
    S.elegida = el; el.classList.add('elegida'); mensaje('Tocá la caja correcta 👇', 'ok');
  }

  function intentar(el, cat, caja, d){
    var p = el._p;
    if(S.elegida){ S.elegida.classList.remove('elegida'); S.elegida = null; }
    if(p.categoria === cat){ acierto(el, caja, d); }
    else { error(el, caja, d); }
  }

  function volver(d, conError){
    if(!d || !d.fantasmaOn){ if(d) d.el.classList.remove('arrastrando'); return; }
    fan.classList.add('vuelve'); fan.style.left = d.ix + 'px'; fan.style.top = d.iy + 'px'; fan.style.transform = 'scale(1) rotate(0)';
    setTimeout(function(){ fan.className = ''; fan.style.transform = ''; d.el.classList.remove('arrastrando'); }, 360);
  }

  function error(el, caja, d){
    S.errores++; $('h-errores').textContent = S.errores;
    mensaje(CONFIG.mensajeError, 'mal');
    caja.classList.remove('sacude'); void caja.offsetWidth; caja.classList.add('sacude');
    vibrar(60);
    if(d) volver(d, true); else el.classList.remove('arrastrando');
  }

  function acierto(el, caja, d){
    var p = el._p;
    if(d && d.fantasmaOn){ fan.className = ''; }
    var rf = caja.getBoundingClientRect();
    /* saca la pieza de la bandeja y la deja en la caja */
    var slot = el.parentNode; el.remove(); slot.style.opacity = '.45';
    var chip = document.createElement('div'); chip.className = 'puesta'; chip.title = p.nombre; pintar(chip, p);
    caja.querySelector('.dentro').appendChild(chip);
    var rc = chip.getBoundingClientRect();
    chispas(rc.left + rc.width/2, rc.top + rc.height/2);
    mensaje(CONFIG.mensajesAcierto[Math.floor(Math.random()*CONFIG.mensajesAcierto.length)], 'ok');
    vibrar(25);
    S.ordenadas++; $('h-orden').textContent = S.ordenadas;
    if(S.ordenadas >= S.total) setTimeout(terminar, 900);
  }

  function chispas(x, y){
    var em = ['✨','🌸','💖','⭐'];
    for(var i=0;i<9;i++){
      var s = document.createElement('div'); s.className = 'chispa'; s.textContent = em[i%em.length];
      var a = Math.random()*6.28, r = 40 + Math.random()*55;
      s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--dx', Math.cos(a)*r + 'px'); s.style.setProperty('--dy', Math.sin(a)*r - 20 + 'px');
      document.body.appendChild(s); (function(n){ setTimeout(function(){ n.remove(); }, 850); })(s);
    }
  }

  /* ---------- final ---------- */
  function terminar(){
    S.activo = false; clearInterval(S.reloj);
    var seg = Math.max(1, Math.round((performance.now() - S.t0)/1000));
    var marca = { errores:S.errores, tiempo:seg }, m = leerMejor();
    var mejora = !m || marca.errores < m.errores || (marca.errores === m.errores && marca.tiempo < m.tiempo);
    if(mejora) guardarMejor(marca);
    $('f-errores').textContent = S.errores; $('f-tiempo').textContent = seg;
    $('f-mejor').textContent = (mejora && m ? '🏆 ¡Nuevo récord! ' : (mejora ? '🏆 ¡Tu primera marca! ' : '')) + (mejora ? '' : textoMejor(m));
    $('f-codigo').textContent = CONFIG.cuponNombre;
    $('f-cupon-t').textContent = '¡Ganaste tu cupón ' + CONFIG.cuponNombre + '! ' + CONFIG.cuponDescuento + '% de descuento en tu próxima compra.';
    $('hud').classList.remove('on'); $('juego').classList.remove('on');
    $('p-fin').classList.add('on');
    vibrar([30,30,60]);
  }

  function abrirWhatsApp(texto){
    var url = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(texto);
    var w = window.open(url, '_blank'); if(!w) location.href = url;
  }
  $('b-empezar').addEventListener('click', empezar);
  $('b-otra').addEventListener('click', function(){ mejorInicio(); empezar(); });
  $('b-canjear').addEventListener('click', function(){
    abrirWhatsApp('¡Hola! Ordené el mostrador de Manojito y gané mi cupón ' + CONFIG.cuponNombre + ' 🌸 Quiero canjearlo.');
  });
  $('b-compartir').addEventListener('click', function(){
    abrirWhatsApp('¡Ordené el mostrador de Manojito con ' + S.errores + (S.errores === 1 ? ' error' : ' errores') + '! 🌸 ¿Podés hacerlo mejor que yo? Jugá acá: ' + CONFIG.linkCompartir);
  });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
  window.__mostrador = { S: S, CONFIG: CONFIG }; // solo para pruebas
})();
</script>
