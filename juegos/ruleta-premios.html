<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde6ec">
<title>Ruleta de premios · Manojito</title>
<meta name="description" content="Girá la ruleta de Manojito, descubrí tu premio y canjealo por WhatsApp.">
<style>
  :root{
    --rosa:#f4b6c5; --rosa-fuerte:#d9849d; --rosa-oscuro:#a8576f;
    --crema:#fff6ea; --blanco:#fffdfb; --dorado:#e8c477; --dorado-oscuro:#b88a3e; --marron:#7a5a48;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:#f3d9df;font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--marron)}
  body{-webkit-user-select:none;user-select:none}
  #app{position:relative;margin:0 auto;min-height:100vh;min-height:100dvh;max-width:520px;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 1.5px 1.5px,rgba(232,196,119,.45) 1.4px,transparent 1.6px) 0 0/26px 26px,
               linear-gradient(180deg,#fff6ea 0%,#fde6ec 100%);box-shadow:0 0 40px rgba(168,87,111,.25)}

  .marca{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dorado-oscuro);font-weight:800;margin-bottom:6px;text-align:center}
  h1{font-family:Georgia,'Lora',serif;font-style:italic;font-weight:700;color:var(--rosa-oscuro);margin:0 0 6px;text-align:center;
    font-size:clamp(26px,8vw,34px);line-height:1.12}
  .sub{margin:0 0 16px;text-align:center;font-size:15px;line-height:1.4;max-width:320px}

  /* ruleta */
  #zona{position:relative;width:min(88vw,340px);aspect-ratio:1/1;margin:6px auto 4px}
  #aro{position:absolute;inset:0;border-radius:50%;padding:10px;
    background:linear-gradient(135deg,#f3dca4,#e8c477 45%,#c99a4a);
    box-shadow:0 14px 24px rgba(168,87,111,.32),inset 0 2px 4px rgba(255,255,255,.7)}
  #aro::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px dashed rgba(255,255,255,.75);pointer-events:none}
  #giro{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
    transition:transform 5.2s cubic-bezier(.12,.62,.08,1);will-change:transform;box-shadow:inset 0 0 0 3px rgba(255,255,255,.8)}
  #giro.sin{transition:none}
  #rueda{width:100%;height:100%;display:block}
  /* botón central, como un botón de costura */
  #centro{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;margin:-9% 0 0 -9%;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 35% 30%,#fff 0%,#fde6ec 55%,#f4b6c5 100%);border:3px solid var(--dorado);
    box-shadow:0 3px 8px rgba(168,87,111,.4);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,26px)}
  #centro::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed var(--rosa-fuerte);opacity:.8}
  /* moñito que marca el premio */
  #flecha{position:absolute;left:50%;top:-14px;margin-left:-19px;width:38px;z-index:4;text-align:center;font-size:30px;line-height:1;
    filter:drop-shadow(0 3px 3px rgba(168,87,111,.45));transform-origin:50% 20%}
  #flecha::after{content:"";display:block;margin:-6px auto 0;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:17px solid var(--rosa-oscuro)}
  #flecha.tic{animation:tic .18s ease}
  @keyframes tic{0%{transform:rotate(0)}40%{transform:rotate(-14deg)}100%{transform:rotate(0)}}

  /* acciones */
  #acciones{width:min(100%,340px);margin-top:18px}
  .btn{display:block;width:100%;border:none;border-radius:999px;padding:15px 18px;font-family:inherit;font-weight:800;font-size:18px;line-height:1.1;
    cursor:pointer;color:#fff;margin-top:10px;transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn.girar{background:linear-gradient(135deg,#e592ab,#b9627c);box-shadow:0 7px 16px rgba(185,98,124,.4)}
  .btn.girar[disabled]{opacity:.55;cursor:default;box-shadow:none}
  .btn.wa{background:linear-gradient(135deg,#34c26c,#1f9a52);box-shadow:0 6px 14px rgba(31,154,82,.35)}
  .btn.sec{background:#fff;color:var(--rosa-oscuro);border:2px solid var(--rosa-fuerte)}
  .btn.link{background:none;color:var(--marron);text-decoration:underline;font-size:15px;font-weight:700;padding:10px}
  .aviso{margin-top:10px;text-align:center;font-size:13.5px;color:var(--dorado-oscuro);font-weight:800;line-height:1.35}
  .oculto{display:none!important}

  /* tarjeta del premio */
  #velo{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(122,90,72,.45);backdrop-filter:blur(2px)}
  #velo.on{display:flex}
  #premioCard{position:relative;width:min(100%,360px);background:radial-gradient(circle at 50% 30%,#fffdf6 0%,#fff0c9 60%,#ffe3ea 100%);
    border:3px solid #f0cfd7;border-radius:24px;padding:26px 20px 20px;text-align:center;box-shadow:0 18px 40px rgba(168,87,111,.4);
    animation:pop .55s cubic-bezier(.2,1.3,.4,1) both}
  #premioCard::before{content:"";position:absolute;inset:7px;border-radius:18px;border:2px dashed rgba(184,138,62,.6);pointer-events:none}
  @keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
  #p-felic{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dorado-oscuro);font-weight:800}
  #p-emoji{font-size:clamp(46px,15vw,64px);line-height:1.1;margin:6px 0 0;filter:drop-shadow(0 3px 4px rgba(168,87,111,.25))}
  #p-titulo{font-family:Georgia,'Lora',serif;font-weight:700;color:var(--rosa-oscuro);font-size:clamp(26px,8vw,34px);line-height:1.1;margin:4px 0 4px}
  #p-detalle{font-size:15px;line-height:1.35;font-weight:700;padding:0 6px}
  #p-codigo{margin-top:10px;display:inline-block;border:2px dashed var(--dorado-oscuro);border-radius:12px;padding:5px 16px;font-family:Georgia,serif;
    font-weight:700;letter-spacing:.12em;color:var(--rosa-oscuro);background:rgba(255,255,255,.75);font-size:18px}
  #premioCard .btn{position:relative}
  #confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
  @media (max-height:660px){.sub{display:none}#zona{width:min(70vw,280px)}}
</style>
</head>
<body>
<div id="app">
  <div class="marca">Manojito · Artesanías de Mendoza</div>
  <h1>Ruleta de premios 🎀</h1>
  <p class="sub" id="sub">Girá la ruleta una vez y llevate un premio de regalo.</p>

  <div id="zona">
    <div id="flecha" aria-hidden="true">🎀</div>
    <div id="aro">
      <div id="giro" class="sin"><canvas id="rueda"></canvas></div>
      <div id="centro" aria-hidden="true">🌸</div>
    </div>
  </div>

  <div id="acciones">
    <button class="btn girar" id="btnGirar" type="button">🎡 Girar la ruleta</button>
    <div class="aviso" id="aviso">Tenés 1 giro. ¡Mucha suerte! 🍀</div>
    <button class="btn wa oculto" id="btnWaMain" type="button">💬 Canjear por WhatsApp</button>
    <button class="btn link oculto" id="btnVer" type="button">Ver mi premio</button>
    <button class="btn link" id="btnTienda" type="button">🛍️ Ir a la tienda</button>
  </div>
</div>

<!-- premio -->
<div id="velo" role="dialog" aria-modal="true" aria-labelledby="p-titulo">
  <div id="premioCard">
    <div id="p-felic">¡Felicitaciones!</div>
    <div id="p-emoji"></div>
    <div id="p-titulo"></div>
    <div id="p-detalle"></div>
    <div id="p-codigo"></div>
    <button class="btn wa" id="btnWa" type="button">💬 Canjear por WhatsApp</button>
    <button class="btn sec" id="btnComp" type="button">📤 Compartir la ruleta</button>
    <button class="btn link" id="btnCerrar" type="button">Cerrar</button>
  </div>
</div>
<canvas id="confeti"></canvas>

<script>
/* ==========================================================
   ⚙️  CONFIGURACIÓN: acá cambiás todo lo importante
   ========================================================== */
var CONFIG = {
  whatsapp: '5492617142759',        // número con código de país, sin + ni espacios
  linkCompartir: 'https://susytala.github.io/Web/juegos/ruleta-premios.html',
  linkTienda: '../',                // a dónde lleva "Ir a la tienda"

  /* Un solo giro por persona (se guarda en el celular/navegador).
     Para volver a probar vos: borrá los datos del sitio, o poné true en "permitirReiniciar" y abrí el link con #reiniciar */
  unSoloGiro: true,
  permitirReiniciar: true,

  /* 6 PREMIOS. "peso" = probabilidad relativa (más alto = sale más seguido).
     "color" = color del gajo. Para usar foto en vez de emoji no hace falta: la ruleta usa emojis. */
  premios: [
    { emoji: '🌸', corto: '5% OFF',   titulo: '5% OFF',    detalle: 'de descuento en tu próxima compra',            codigo: 'MANO5',    peso: 28, color: '#f7c9d4' },
    { emoji: '🎀', corto: '10% OFF',  titulo: '10% OFF',   detalle: 'de descuento en tu próxima compra',            codigo: 'MANO10',   peso: 24, color: '#fff0c9' },
    { emoji: '🎁', corto: 'Regalito', titulo: 'Regalito',  detalle: 'una pieza sorpresa de regalo con tu compra',   codigo: 'REGALITO', peso: 16, color: '#f4b6c5' },
    { emoji: '✨', corto: '15% OFF',  titulo: '15% OFF',   detalle: 'de descuento en tu próxima compra',            codigo: 'MANO15',   peso: 10, color: '#f3dca4' },
    { emoji: '🛍️', corto: 'Lazo gratis', titulo: 'Lazo gratis', detalle: 'packaging de regalo gratis en tu pedido',  codigo: 'LAZO',     peso: 14, color: '#fde6ec' },
    { emoji: '🧸', corto: '20% OFF',  titulo: '20% OFF',   detalle: 'en un accesorio a elección',                   codigo: 'MANO20',   peso: 8,  color: '#e8c477' }
  ]
};

/* ==========================================================
   Juego (no hace falta tocar nada de acá para abajo)
   ========================================================== */
(function(){
  var KEY = 'manojito_ruleta_v1';
  var N = CONFIG.premios.length;           // 6
  var SEG = 360 / N;
  var $ = function(id){ return document.getElementById(id); };
  var giro = $('giro'), btn = $('btnGirar'), girando = false, rotActual = 0, premio = null;

  if(CONFIG.permitirReiniciar && location.hash === '#reiniciar'){ try{ localStorage.removeItem(KEY); }catch(e){} }

  /* ---------- dibujar la rueda ---------- */
  function dibujar(){
    var cv = $('rueda'), dpr = Math.min(window.devicePixelRatio || 1, 3);
    var s = Math.round($('giro').getBoundingClientRect().width) || 320;
    cv.width = cv.height = s * dpr; cv.style.width = cv.style.height = s + 'px';
    var c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,s,s);
    var cx = s/2, cy = s/2, r = s/2;
    for(var i=0;i<N;i++){
      var a0 = (-90 + i*SEG) * Math.PI/180, a1 = (-90 + (i+1)*SEG) * Math.PI/180;
      c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,r,a0,a1); c.closePath();
      c.fillStyle = CONFIG.premios[i].color; c.fill();
      c.lineWidth = 2.5; c.strokeStyle = '#fffdfb'; c.stroke();
      /* costurita dentro del gajo */
      c.save(); c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,r-7,a0+0.06,a1-0.06); c.closePath();
      c.setLineDash([5,5]); c.lineWidth = 1.6; c.strokeStyle = 'rgba(168,87,111,.45)'; c.stroke(); c.restore();
      /* texto y emoji */
      c.save(); c.translate(cx,cy); c.rotate((a0+a1)/2);
      c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillStyle = '#7a4560';
      var fs = Math.round(s*0.056), maxW = s*0.215;           // el texto se achica solo si no entra entre el botón central y el emoji
      do{ c.font = '800 ' + fs + 'px Nunito, "Segoe UI", system-ui, sans-serif'; fs--; }while(c.measureText(CONFIG.premios[i].corto).width > maxW && fs > 8);
      c.fillText(CONFIG.premios[i].corto, r - s*0.145, 0);
      c.font = Math.round(s*0.088) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      c.fillText(CONFIG.premios[i].emoji, r - s*0.045, 1);
      c.restore();
    }
    /* puntitos dorados en el borde */
    for(var k=0;k<N*3;k++){
      var an = (-90 + k*(360/(N*3)))*Math.PI/180;
      c.beginPath(); c.arc(cx+Math.cos(an)*(r-3.5), cy+Math.sin(an)*(r-3.5), 2.2, 0, 7);
      c.fillStyle = '#fffdfb'; c.fill();
    }
  }

  /* ---------- sorteo y giro ---------- */
  function sortear(){
    var total = 0; CONFIG.premios.forEach(function(p){ total += (p.peso || 1); });
    var r = Math.random() * total;
    for(var i=0;i<N;i++){ r -= (CONFIG.premios[i].peso || 1); if(r <= 0) return i; }
    return 0;
  }
  function guardado(){
    if(!CONFIG.unSoloGiro) return -1;
    try{
      var g = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(g) for(var i=0;i<N;i++) if(CONFIG.premios[i].codigo === g.codigo) return i;
    }catch(e){}
    return -1;
  }
  function recordar(i){
    if(!CONFIG.unSoloGiro) return;
    try{ localStorage.setItem(KEY, JSON.stringify({ codigo: CONFIG.premios[i].codigo, t: Date.now() })); }catch(e){}
  }
  /* rotación para que el centro del gajo i quede arriba (bajo el moñito) */
  function rotPara(i, extra){ return -(i*SEG + SEG/2) + (extra || 0); }

  function girar(){
    if(girando || btn.disabled) return;
    girando = true; btn.disabled = true; btn.textContent = '🎡 Girando…';
    $('aviso').textContent = '¡Cruzamos los dedos! 🤞';
    var idx = sortear();
    var jitter = (Math.random() - .5) * (SEG * .6);          // cae en cualquier parte del gajo, sin tocar los bordes
    var vueltas = 360 * (6 + Math.floor(Math.random()*3));
    var destino = rotPara(idx, jitter) - vueltas;
    /* guardamos YA el resultado: si cierran la página mientras gira, igual cuenta como giro usado */
    recordar(idx);
    giro.classList.remove('sin');
    void giro.offsetWidth;
    giro.style.transform = 'rotate(' + destino + 'deg)';
    rotActual = destino;
    ticTac(5200);
    var listo = false;
    function fin(){ if(listo) return; listo = true; giro.removeEventListener('transitionend', onEnd); terminar(idx); }
    function onEnd(e){ if(e.target === giro && e.propertyName === 'transform') fin(); }
    giro.addEventListener('transitionend', onEnd);
    setTimeout(fin, 5600);
  }

  /* "tic" del moñito mientras pasa por cada gajo */
  function ticTac(dur){
    var t0 = performance.now(), ultimo = -1, fl = $('flecha');
    (function loop(){
      var t = performance.now() - t0; if(t > dur || !girando) return;
      var cur = giro.getBoundingClientRect(); // fuerza lectura del estilo transformado
      var m = getComputedStyle(giro).transform, ang = 0;
      if(m && m !== 'none'){ var v = m.match(/matrix\(([^)]+)\)/); if(v){ var p = v[1].split(','); ang = Math.atan2(parseFloat(p[1]), parseFloat(p[0])) * 180/Math.PI; } }
      var seg = Math.floor((((-ang) % 360) + 360) % 360 / SEG);
      if(seg !== ultimo){ ultimo = seg; fl.classList.remove('tic'); void fl.offsetWidth; fl.classList.add('tic'); }
      requestAnimationFrame(loop);
    })();
  }

  function terminar(idx){
    girando = false; premio = CONFIG.premios[idx];
    bloquear(true);
    setTimeout(function(){ mostrar(premio); confeti(); }, 250);
  }

  /* ---------- estado y premio ---------- */
  function bloquear(yaGiro){
    if(!yaGiro) return;
    btn.disabled = true; btn.textContent = '✅ Ya giraste la ruleta';
    $('sub').textContent = 'Cada persona puede girar una sola vez. ¡Canjeá tu premio!';
    $('aviso').textContent = 'Tu premio: ' + premio.emoji + ' ' + premio.titulo + ' · Cupón ' + premio.codigo;
    $('btnWaMain').classList.remove('oculto'); $('btnVer').classList.remove('oculto');
  }
  function mostrar(p){
    $('p-emoji').textContent = p.emoji;
    $('p-titulo').textContent = p.titulo;
    $('p-detalle').textContent = p.detalle;
    $('p-codigo').textContent = 'Cupón ' + p.codigo;
    $('velo').classList.add('on');
  }
  function whatsapp(){
    if(!premio) return;
    var msg = '¡Hola Manojito! 🌸 Giré la ruleta y gané *' + premio.titulo + '* (' + premio.detalle + '). Mi cupón es *' + premio.codigo + '*. ¿Cómo lo canjeo?';
    var url = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg);
    var w = null; try{ w = window.open(url, '_blank'); }catch(e){}
    if(!w) location.href = url;
  }
  function compartir(){
    var texto = '¡Girá la ruleta de premios de Manojito y llevate un regalo! 🎀';
    if(navigator.share){ navigator.share({ title: 'Ruleta de premios · Manojito', text: texto, url: CONFIG.linkCompartir }).catch(function(){}); return; }
    var url = 'https://wa.me/?text=' + encodeURIComponent(texto + ' ' + CONFIG.linkCompartir);
    var w = null; try{ w = window.open(url, '_blank'); }catch(e){}
    if(!w) location.href = url;
  }
  function irTienda(){ location.href = CONFIG.linkTienda; }

  /* ---------- confeti artesanal ---------- */
  function confeti(){
    var cv = $('confeti'), c = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; c.setTransform(dpr,0,0,dpr,0,0);
    var cols = ['#f4b6c5','#e8c477','#d9849d','#fff0c9','#a8576f'], emo = ['🌸','🎀','✨'], ps = [];
    for(var i=0;i<90;i++) ps.push({ x: innerWidth/2, y: innerHeight*.4, vx:(Math.random()-.5)*11, vy:-Math.random()*11-3,
      g:.28, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%cols.length], t:i%9===0?emo[i%3]:null, w:5+Math.random()*6 });
    var t0 = performance.now();
    (function loop(now){
      var dt = now - t0; c.clearRect(0,0,innerWidth,innerHeight);
      ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.99; p.r+=p.vr;
        c.save(); c.translate(p.x,p.y); c.rotate(p.r);
        if(p.t){ c.font='18px sans-serif'; c.fillText(p.t,-9,6); } else { c.fillStyle=p.c; c.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); }
        c.restore(); });
      if(dt < 3200) requestAnimationFrame(loop); else c.clearRect(0,0,innerWidth,innerHeight);
    })(t0);
  }

  /* ---------- eventos e inicio ---------- */
  btn.addEventListener('click', girar);
  $('btnWa').addEventListener('click', whatsapp);
  $('btnWaMain').addEventListener('click', whatsapp);
  $('btnComp').addEventListener('click', compartir);
  $('btnCerrar').addEventListener('click', function(){ $('velo').classList.remove('on'); });
  $('btnVer').addEventListener('click', function(){ if(premio) mostrar(premio); });
  $('btnTienda').addEventListener('click', irTienda);
  $('velo').addEventListener('click', function(e){ if(e.target === this) this.classList.remove('on'); });

  dibujar();
  var resizeT; addEventListener('resize', function(){ clearTimeout(resizeT); resizeT = setTimeout(dibujar, 150); });

  var previo = guardado();
  if(previo >= 0){
    /* ya giró antes: dejamos la ruleta en su premio y no dejamos girar */
    premio = CONFIG.premios[previo];
    giro.style.transform = 'rotate(' + rotPara(previo, 0) + 'deg)';
    bloquear(true);
  } else {
    giro.style.transform = 'rotate(0deg)';
  }
  setTimeout(function(){ giro.classList.remove('sin'); }, 60);
})();
</script>
</body>
</html>
