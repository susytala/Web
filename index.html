<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manojito · Insumos</title>
<style>
  :root{
    --verde:#0f5257; --crema:#fdf8f1; --naranja:#f26a3d; --amarillo:#ffd25a;
    --tinta:#12302f; --borde:#12302f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{max-width:100%;overflow-x:hidden}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--crema);color:var(--tinta)}
  img,svg{max-width:100%}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 16px;background:#fff;border-bottom:2px solid var(--naranja);flex-wrap:wrap}
  .logo{font-family:Georgia,serif;font-size:1.4rem;font-weight:700;color:var(--verde)}
  .logo small{font-family:system-ui;font-size:.6rem;background:var(--amarillo);padding:3px 7px;border-radius:6px;margin-left:6px;letter-spacing:.08em}
  .nav{display:flex;gap:8px}
  .btn-nav{border:2px solid var(--borde);background:#e6f2ee;padding:7px 12px;border-radius:10px;font-weight:700;font-size:.85rem;cursor:pointer}
  .btn-nav.carrito{background:var(--naranja);color:#fff}

  /* Hero */
  .hero{background:var(--verde);color:#fff;padding:28px 16px 32px}
  .tag{display:inline-block;background:var(--amarillo);color:var(--tinta);font-weight:700;font-size:.7rem;
    letter-spacing:.1em;padding:6px 10px;border-radius:8px;transform:rotate(-2deg)}
  .hero h1{font-family:Georgia,serif;font-size:clamp(1.9rem,8vw,3rem);margin:14px 0 10px;line-height:1.1}
  .hero h1 span{color:var(--amarillo)}
  .hero p{max-width:520px;opacity:.9;line-height:1.4;margin-bottom:18px}
  .search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:12px 14px;
    max-width:520px;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
  .search input{border:0;outline:0;flex:1;min-width:0;font-size:1rem;background:transparent}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .pills span{border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:999px;font-size:.8rem}

  /* Categorías: scroll horizontal SOLO dentro de esta barra */
  .cats{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;border-bottom:1px solid #e3dccf;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:0 0 auto;border:2px solid var(--borde);background:#fff;border-radius:999px;
    padding:8px 14px;font-weight:700;font-size:.9rem;white-space:nowrap;cursor:pointer}
  .cat.activa{background:var(--verde);color:#fff}
  .cat small{opacity:.6;margin-left:4px}

  main{padding:14px 16px 90px;max-width:1200px;margin:auto}
  .crumbs{font-size:.8rem;margin-bottom:12px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar button,.toolbar select{border:2px solid var(--borde);background:#fff;padding:10px 14px;border-radius:10px;font-size:.9rem}
  .toolbar .count{margin-left:auto;font-weight:700;font-size:.85rem;opacity:.8}

  /* GRILLA RESPONSIVE: 2 columnas en celular */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
  @media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

  .card{background:#fff;border:2px solid var(--borde);border-radius:16px;overflow:hidden;
    box-shadow:4px 4px 0 var(--borde);display:flex;flex-direction:column}
  .thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:3.2rem;position:relative;border-bottom:2px solid var(--borde)}
  .badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
  .badge{font-size:.62rem;font-weight:700;padding:3px 7px;border-radius:6px;color:#fff;background:var(--naranja)}
  .badge.nuevo{background:var(--verde)}
  .info{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
  .cat-name{font-size:.65rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;opacity:.75}
  .name{font-family:Georgia,serif;font-weight:700;font-size:.95rem;line-height:1.25;flex:1}
  .precio{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .precio b{background:var(--amarillo);border:2px solid var(--borde);border-radius:8px;padding:3px 8px;font-size:1.05rem}
  .precio s{font-size:.75rem;opacity:.55}
  .add{border:2px solid var(--borde);background:var(--naranja);color:#fff;font-weight:700;
    padding:10px 6px;border-radius:10px;cursor:pointer;font-size:.85rem;box-shadow:2px 2px 0 var(--borde)}

  /* Botón flotante WhatsApp */
  .wa{position:fixed;left:14px;bottom:14px;width:52px;height:52px;border-radius:14px;background:var(--verde);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;
    border:2px solid var(--borde);text-decoration:none;box-shadow:3px 3px 0 var(--borde)}
</style>
</head>
<body>

<header>
  <div class="logo">Manojito <small>INSUMOS</small></div>
  <div class="nav">
    <button class="btn-nav">🛍️ Tienda</button>
    <button class="btn-nav carrito">🛒 Carrito (<span id="cant">0</span>)</button>
  </div>
</header>

<section class="hero">
  <span class="tag">INSUMOS · MENDOZA</span>
  <h1>Todo para tus <span>manualidades</span></h1>
  <p>Ojos, pinturas, herramientas y accesorios para porcelana fría. Armá tu pedido y lo coordinamos por WhatsApp.</p>
  <label class="search">🔍 <input id="buscar" type="search" placeholder="Buscá ojos, pintura, moldes…"></label>
  <div class="pills">
    <span>💬 Pedí por WhatsApp</span>
    <span>📍 Retiro en Mendoza</span>
    <span>🤲 Seleccionados</span>
  </div>
</section>

<nav class="cats" id="cats"></nav>

<main>
  <div class="crumbs"><b>Inicio</b> › Insumos</div>
  <div class="toolbar">
    <button>⚙️ Filtros</button>
    <select id="orden">
      <option>Destacados</option>
      <option value="menor">Menor precio</option>
      <option value="mayor">Mayor precio</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<a class="wa" href="https://wa.me/5492610000000" aria-label="WhatsApp">💬</a>

<script>
const productos = [
  {n:"Ojos 3D autoadhesivos · blister x6",c:"Ojos",cat:"Ojos 3D",p:1400,o:1600,e:"👀",bg:"#fde4dc",b:["13% OFF","Nuevo"],op:true},
  {n:"Porcelana fría lista · 500 g",c:"Masas y moldes",cat:"Porcelana fría",p:3500,e:"🍥",bg:"#efdcf3",b:["Nuevo"],op:true},
  {n:"Verniz acrílico fosco Acrilex 100 ml",c:"Pinturas",cat:"Acrílicos",p:56000,e:"🧴",bg:"#e6ecfb",b:["Nuevo"]},
  {n:"Acrílico mate 60 ml",c:"Pinturas",cat:"Acrílicos",p:1200,o:1350,e:"🖌️",bg:"#dff1ea",b:["11% OFF"],op:true},
  {n:"Mix de ojos 3D · 50 unidades",c:"Ojos",cat:"Mix de ojos",p:3200,o:3600,e:"🎁",bg:"#fde4dc",b:["11% OFF"]},
  {n:"Set de palillos de modelar · 5 piezas",c:"Herramientas",cat:"Palillos",p:2600,e:"🥢",bg:"#fdf0c4",b:[]},
  {n:"Bases de broche · x10",c:"Bases y accesorios",cat:"Bases para broche",p:800,e:"📌",bg:"#e0e8fb",b:[],op:true},
  {n:"Ojos 3D con pestañas",c:"Ojos",cat:"Ojos 3D",p:1800,e:"👁️",bg:"#fde4dc",b:[],op:true},
  {n:"Cortantes de flores · set x6",c:"Herramientas",cat:"Rodillos y cortantes",p:2400,e:"🌼",bg:"#fdf0c4",b:["Nuevo"]},
  {n:"Acrílico nacarado 60 ml",c:"Pinturas",cat:"Acrílicos",p:1500,e:"🎨",bg:"#dff1ea",b:[],op:true},
  {n:"Cinta de satén · rollo",c:"Bases y accesorios",cat:"Cintas y moños",p:700,e:"🎀",bg:"#e0e8fb",b:[],op:true},
  {n:"Ojos reales de acrílico · par",c:"Ojos",cat:"Ojos reales",p:900,e:"🔵",bg:"#fde4dc",b:[],op:true}
];

const cats = ["Todos","Ojos","Pinturas","Herramientas","Bases y accesorios","Masas y moldes"];
let catActiva = "Todos", carrito = 0;
const $ = id => document.getElementById(id);
const money = n => "$" + n.toLocaleString("es-AR");

function pintarCats(){
  $("cats").innerHTML = cats.map(c=>{
    const n = c==="Todos" ? productos.length : productos.filter(p=>p.c===c).length;
    return `<button class="cat ${c===catActiva?'activa':''}" data-c="${c}">${c} <small>${n}</small></button>`;
  }).join("");
}

function pintar(){
  const q = $("buscar").value.toLowerCase().trim();
  let lista = productos.filter(p =>
    (catActiva==="Todos" || p.c===catActiva) && p.n.toLowerCase().includes(q));
  const o = $("orden").value;
  if(o==="menor") lista.sort((a,b)=>a.p-b.p);
  if(o==="mayor") lista.sort((a,b)=>b.p-a.p);
  $("count").textContent = lista.length + " productos";
  $("grid").innerHTML = lista.map(p=>`
    <article class="card">
      <div class="thumb" style="background:${p.bg}">
        <div class="badges">${p.b.map(x=>`<span class="badge ${x==='Nuevo'?'nuevo':''}">${x}</span>`).join("")}</div>
        ${p.e}
      </div>
      <div class="info">
        <div class="cat-name">${p.cat}</div>
        <div class="name">${p.n}</div>
        <div class="precio"><b>${money(p.p)}</b>${p.o?`<s>${money(p.o)}</s>`:""}</div>
        <button class="add">${p.op?"Elegir opciones":"Agregar al carrito"}</button>
      </div>
    </article>`).join("");
}

$("cats").addEventListener("click",e=>{
  const b = e.target.closest(".cat"); if(!b) return;
  catActiva = b.dataset.c; pintarCats(); pintar();
});
$("grid").addEventListener("click",e=>{
  if(e.target.classList.contains("add")){ carrito++; $("cant").textContent = carrito; }
});
$("buscar").addEventListener("input",pintar);
$("orden").addEventListener("change",pintar);

pintarCats(); pintar();
</script>
</body>
</html>
